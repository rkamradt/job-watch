# Job board configuration for job-watch.
# Mount this file via a Kubernetes ConfigMap at /config/companies.yaml.
#
# To verify a slug: job-watch check-slug <ats> <slug>

companies:
  - { name: Toast,       ats: greenhouse, slug: toast }
  - { name: Smartsheet,  ats: greenhouse, slug: smartsheet }
  - { name: Instacart,   ats: greenhouse, slug: instacart }
  - { name: Mattermost,  ats: greenhouse, slug: mattermost }
  - { name: "Hims & Hers", ats: ashby,   slug: hims-and-hers }
  - { name: Weave,       ats: ashby,      slug: weave }
  - { name: Arcadia,    ats: lever,      slug: arcadia }

filter:
  title_include:
    - principal
    - staff
    - lead
    - "senior staff"

  title_engineering:
    - engineer
    - developer
    - architect
    - swe
    - software

  title_exclude:
    - manager
    - director
    - intern
    - "data scientist"
    - sales
    - recruiter
    - "business development"
    - emea
    - apac
    - latam
    - designer
    - "product manager"
    - "program manager"
    - analyst

  # A job passes location if it matches no drop pattern AND either matches a keep
  # pattern or has an empty/unknown location. Matching is case-insensitive substring.
  location_keep_patterns:
    - remote
    - "united states"
    - " us "
    - "u.s."
    - maine
    - boston
    - anywhere
    - nationwide
    - "new england"

  location_drop_patterns:
    - "united kingdom"
    - " uk"
    - england
    - london
    - ireland
    - dublin
    - canada
    - toronto
    - vancouver
    - europe
    - germany
    - france
    - netherlands
    - spain
    - sweden
    - denmark
    - norway
    - finland
    - poland
    - bulgaria
    - romania
    - australia
    - sydney
    - india
    - bangalore
    - singapore
    - "hong kong"
    - japan
    - china
    - brazil
    - mexico
    - israel
    - "tel aviv"
    - "new zealand"
    - "south africa"
    - chennai
    - taiwan
    - "taipei"

  boost_keywords:
    - kafka
    - kubernetes
    - "event-driven"
    - platform
    - java
    - kotlin
    - " ai"
    - llm
    - "machine learning"

screening:
  enabled: true
  model: claude-haiku-4-5-20251001
  candidate_profile: |
    20+ years of software engineering experience. Deep expertise in Java and Kotlin for
    distributed systems and microservices. Strong background in event-driven architecture
    and Apache Kafka. Experienced with Kubernetes and cloud-native deployments. Also
    comfortable with Go and Python. Interested in AI/LLM integration and platform
    engineering. Looking for Staff or Principal Engineer or Architect roles. Prefers
    US remote or Maine/Boston area. Not interested in management tracks, data science,
    design, or non-engineering roles.

gmail_discovery:
  enabled: false            # set to true to read job-alert emails from Gmail
  alert_senders:
    - jobalerts-noreply@linkedin.com
    - jobs-noreply@linkedin.com
    - donotreply@match.indeed.com
    - team@hi.wellfound.com
    - noreply@glassdoor.com
  llm_fallback_enabled: true
  llm_fallback_model: claude-haiku-4-5-20251001
  auto_activate: false          # true → promote candidate→active automatically when a board is found
  probe_rate_limit_delay: 2.0   # seconds between ATS probe attempts
  negative_cache_ttl_days: 30   # days before re-probing a company with no board found
  # Credentials from K8s secret (env vars): GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN
  # Run scripts/gmail_auth.py once locally to generate them.

# HTTP client settings
concurrency_limit: 3
request_timeout_sec: 30
user_agent: "job-watch/0.1 (+https://github.com/rkamradt/job-watch)"
