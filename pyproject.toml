[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-watch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27.0",
    "mcp[cli]>=2.0",
    "motor>=3.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "mongomock-motor>=0.0.21",
]

[project.scripts]
job-watch = "job_watch.main:cli"
job-watch-mcp = "job_watch.mcp.server:run_stdio"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_watch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
